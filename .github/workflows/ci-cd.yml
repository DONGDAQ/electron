# ==============================================================================
# 翻译报价系统 - CI/CD 工作流
# 架构: Electron + Flask 双引擎 Windows 桌面应用
# 触发: push / PR → 测试 + 构建 | tag (v*) → 测试 + 构建 + 发布
# ==============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main, develop, master]
  workflow_dispatch:  # 手动触发
    inputs:
      skip_tests:
        description: '跳过测试直接构建'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      release_draft:
        description: '创建 Draft Release（仅 tag 触发时生效）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

# 并发控制：同一分支只保留最新的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# 环境变量
# ---------------------------------------------------------------------------
env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  # pip 国内镜像
  PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
  PIP_TRUSTED_HOST: pypi.tuna.tsinghua.edu.cn
  # Electron 缓存
  ELECTRON_CACHE_DIR: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

# ============================================================================
# Job 1: 测试阶段 — pytest 单元测试 + API 集成测试
# ============================================================================
jobs:
  test:
    name: Test
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      # ---- 1. Checkout ----
      - name: Checkout code
        uses: actions/checkout@v4

      # ---- 2. Setup Python ----
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: app/requirements.txt

      # ---- 3. Install Python dependencies ----
      - name: Install Python deps
        run: |
          pip install -r app/requirements.txt -i %PIP_INDEX_URL%
          pip install pytest pytest-cov pytest-html -i %PIP_INDEX_URL%

      # ---- 4. Run tests ----
      - name: Run pytest
        if: github.event.inputs.skip_tests != 'true'
        id: pytest
        working-directory: ${{ github.workspace }}
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pytest tests/ `
            --verbose `
            --tb=short `
            --cov=app/quote_system `
            --cov-report=term-missing `
            --cov-report=html:coverage-report `
            --junitxml=test-results.xml `
            2>&1

      # ---- 5. Upload test results ----
      - name: Upload test report (HTML)
        if: always() && github.event.inputs.skip_tests != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: coverage-report/
          retention-days: 7

      - name: Upload JUnit results
        if: always() && github.event.inputs.skip_tests != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: test-results.xml
          retention-days: 7

      # ---- 6. Summary ----
      - name: Test summary
        if: always() && github.event.inputs.skip_tests != 'true'
        run: |
          if ($env:PYTEST_STATUS -eq 0) {
            Write-Host "✅ 所有测试通过"
          } else {
            Write-Host "::warning::测试未通过，请检查日志"
          }
        env:
          PYTEST_STATUS: ${{ steps.pytest.outcome == 'success' && 0 || 1 }}

  # ============================================================================
  # Job 2: 构建阶段 — PyInstaller 打包 Flask + electron-builder 打包桌面应用
  # ============================================================================
  build:
    name: Build
    runs-on: windows-latest
    needs: test
    timeout-minutes: 30

    strategy:
      matrix:
        include:
          - target: nsis
            artifact_name: '翻译报价系统-${{ github.event.release.tag_name || github.sha }}-setup.exe'
          - target: portable
            artifact_name: '翻译报价系统-${{ github.event.release.tag_name || github.sha }}-portable.exe'

    steps:
      # ---- 1. Checkout ----
      - name: Checkout code
        uses: actions/checkout@v4

      # ---- 2. Setup Node.js ----
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package.json

      # ---- 3. Setup Python ----
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ---- 4. Cache Electron ----
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE_DIR }}
            ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Cache electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_BUILDER_CACHE }}
            ~/AppData/Local/electron-builder/Cache/electron
          key: electron-builder-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-

      # ---- 5. Install Node deps ----
      - name: Install Node dependencies
        run: npm ci

      # ---- 6. Install Python deps + PyInstaller ----
      - name: Install Python & build tools
        shell: pwsh
        run: |
          pip install -r app/requirements.txt -i ${env:PIP_INDEX_URL}
          pip install pyinstaller -i ${env:PIP_INDEX_URL}

      # ---- 7. Build Flask server exe (PyInstaller) ----
      - name: Build flask_server.exe
        shell: pwsh
        run: |
          npm run build-flask 2>&1

      # ---- 8. Verify flask_server.exe exists ----
      - name: Verify flask build
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/flask_build/flask_server.exe")) {
            Write-Error "flask_server.exe 构建失败！"
            exit 1
          }
          $size = (Get-Item "dist/flask_build/flask_server.exe").Length / 1MB
          Write-Host "flask_server.exe 大小: $([math]::Round($size, 2)) MB"

      # ---- 9. Build Electron app ----
      - name: Build Electron (${{ matrix.target }})
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false  # 跳过代码签名
        run: |
          npx electron-builder --win ${{ matrix.target }} --config.directories.output=dist 2>&1

      # ---- 10. Run postbuild script ----
      - name: Post-build sync
        shell: pwsh
        run: |
          node scripts/postbuild.js

      # ---- 11. Verify output ----
      - name: Verify build output
        shell: pwsh
        run: |
          $pattern = "dist/${{ matrix.target == 'nsis' && '*.exe' || 'win-unpacked/*' }}"
          $files = Get-ChildItem dist -Recurse -Filter *.exe -ErrorAction SilentlyContinue
          Write-Host "=== 构建产物列表 ==="
          foreach ($f in $files) {
            $size = [math]::Round($f.Length / 1MB, 2)
            Write-Host "  $($f.FullName) ($size MB)"
          }

          if ($files.Count -eq 0) {
            Write-Error "没有找到构建产物！"
            exit 1
          }

      # ---- 12. Upload artifacts ----
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: translation-quote-${{ matrix.target }}
          path: |
            dist/*.exe
          retention-days: 14
          if-no-files-found: error

      # ---- 13. Extract version for release ----
      - name: Extract version info
        id: version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          echo "version=$($pkg.version)" >> $env:GITHUB_OUTPUT
          echo "name=$($pkg.name)" >> $env:GITHUB_OUTPUT

  # ============================================================================
  # Job 3: 发布阶段 — 创建 GitHub Release（仅 tag 触发）
  # ============================================================================
  release:
    name: Release
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      # ---- 1. Checkout ----
      - name: Checkout code
        uses: actions/checkout@v4

      # ---- 2. Download all artifacts ----
      - name: Download NSIS installer
        uses: actions/download-artifact@v4
        with:
          name: translation-quote-nsis
          path: release/

      - name: Download Portable exe
        uses: actions/download-artifact@v4
        with:
          name: translation-quote-portable
          path: release/

      # ---- 3. List release files ----
      - name: List release files
        shell: pwsh
        run: |
          Get-ChildItem release/ -Recurse | Format-Table Name, Length, LastWriteTime -AutoSize

      # ---- 4. Generate changelog ----
      - name: Generate changelog
        id: changelog
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $prevTag = $(git describe --tags --abbrev=0 HEAD~1 2>$null) ?? ""

          $body = "## 翻译报价系统 $tag`n`n"
          $body += "### 下载`n`n"
          $body += "| 文件 | 说明 |`n"
          $body += "|------|------|`n"
          $body += "| `翻译报价系统-$tag-setup.exe` | 安装包 (NSIS) |`n"
          $body += "| `翻译报价系统-$tag-portable.exe` | 便携版，无需安装 |`n`n"

          if ($prevTag) {
            $log = git log "$prevTag..HEAD" --pretty=format:"- %s (%h)" --no-merges
            $body += "### 变更记录`n`n$log"
          }

          # Escape for GitHub API JSON
          $body = $body.Replace('"', '\"').Replace("`n", "\n")
          echo "changelog<<EOF" >> $env:GITHUB_OUTPUT
          echo $body >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

      # ---- 5. Create GitHub Release ----
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "翻译报价系统 ${{ github.ref_name }}"
          body: ${{ steps.changelog.outputs.changelog }}
          draft: ${{ github.event.inputs.release_draft == 'true' }}
          prerelease: contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc')
          files: |
            release/*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # Job 4: 清理 — 删除旧 artifacts 节省空间
  # ============================================================================
  cleanup:
    name: Cleanup old artifacts
    runs-on: ubuntu-latest
    needs: [build, release]
    if: always()
    steps:
      - name: Delete old artifacts
        uses: c-hive/gha-remove-artifacts@v2
        with:
          age: '14 days'
          skip-tags: false
          skip-recent: 5
